<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js | Slider</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="slider-container">
        <div id="slide-number"></div>
        <img src="imgs/image.jpg" alt="">
        <img src="imgs/liana-s-ird6OOE2LXI-unsplash.jpg" alt="">
        <img src="imgs/marek-piwnicki-kE1zeGSBJJk-unsplash.jpg" alt="">
        <img src="imgs/pascal-debrunner-vwFvhJf6u_I-unsplash.jpg" alt="">
        <img src="imgs/we-are-the-chaffins-fgCR4Yj3CLs-unsplash.jpg" alt="">
    </div>
    <div class="slide-controls">
        <span id="prev" class="prev">Previous</span>
        <span id="indicators" class="indicators"></span>
        <span id="next" class="next">Next</span>
    </div>
    <script src="js/index.js"></script>
</body>
</html>
